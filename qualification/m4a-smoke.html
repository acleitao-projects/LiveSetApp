<!doctype html><meta charset="utf-8"><title>LiveSet M4A qualification</title><body><output id="result">Testing native AAC-LC…</output><script type="module">
import {assertNativeAacEncoding,createM4aEncoder,inspectAudio} from '../src/m4a-media.js';
const result=document.querySelector('#result');
try{await assertNativeAacEncoding();const seconds=new URLSearchParams(location.search).has('representative')?180:1,root=await navigator.storage.getDirectory(),live=await root.getDirectoryHandle('liveset',{create:true}),tracks=await live.getDirectoryHandle('tracks',{create:true}),track=await tracks.getDirectoryHandle('m4a-smoke',{create:true}),stemsDir=await track.getDirectoryHandle('stems',{create:true}),generation=await stemsDir.getDirectoryHandle('generation-smoke',{create:true}),frames=48000,left=new Float32Array(frames),right=new Float32Array(frames),names=['vocals','guitar','bass','drums','other'],paths={};let totalBytes=0;for(let stemIndex=0;stemIndex<names.length;stemIndex++){for(let i=0;i<frames;i++)left[i]=right[i]=Math.sin(2*Math.PI*(220+stemIndex*55)*i/48000)*.1;const stem=names[stemIndex],filename=`${stem[0].toUpperCase()}${stem.slice(1)}.m4a`,handle=await generation.getFileHandle(filename,{create:true}),encoder=await createM4aEncoder(handle);for(let second=0;second<seconds;second++)await encoder.add(left,right,second*frames);await encoder.finalize();const file=await handle.getFile(),info=await inspectAudio(file,{requireAac:true});if(info.sampleRate!==48000||info.channels!==2)throw Error(`${stem} validation failed`);totalBytes+=file.size;paths[stem]=`tracks/m4a-smoke/stems/generation-smoke/${filename}`;}const worker=new Worker('../src/stem-preparation-worker.js',{type:'module'}),message=await new Promise((resolve,reject)=>{worker.onmessage=event=>{if(event.data.type==='error')reject(Error(event.data.message));if(event.data.type==='prepared')worker.postMessage({type:'fill',generation:1,buffer:new ArrayBuffer(5*2*12000*4)});if(event.data.type==='packet')resolve(event.data);};worker.onerror=event=>reject(Error(event.message));worker.postMessage({type:'prepare',generation:1,stems:paths,sampleRate:48000,startFrame:0,packetFrames:12000});});if(message.frameCount!==12000||!new Float32Array(message.buffer).some(value=>value!==0))throw Error('Playback preparation returned invalid PCM.');worker.terminate();result.textContent=`PASS: five AAC-LC M4A stems encoded, validated, and streamed to one atomic PCM packet (${totalBytes} bytes for ${seconds} s).`;result.dataset.pass='true';await tracks.removeEntry('m4a-smoke',{recursive:true});}
catch(error){result.textContent=`FAIL: ${error.message}`;result.dataset.pass='false';}
</script>
